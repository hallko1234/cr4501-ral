<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorimeter CR4501 RAL Hack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--grafit:#16181c;--grafit-hell:#1e2127;--linie:#31353d;
  --schrift:#e7e9ec;--gedaempft:#8f959f;
  --signal:#f7d117;--warn:#e8622a;--gut:#3fbf7f;--rand:6px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--grafit);color:var(--schrift);
  font-family:'Barlow',system-ui,sans-serif;font-size:17.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased}
.huelle{max-width:800px;margin:0 auto;padding:0 20px 80px}
code,kbd{font-family:'JetBrains Mono',monospace;font-size:.88em}
a{color:var(--signal)}

#streifen{display:flex;height:64px;width:100%}
#streifen div{flex:1 1 auto;min-width:0}
@media(max-width:640px){#streifen{height:44px}}

#sprachwahl{display:flex;justify-content:flex-end;gap:4px;padding:14px 0 0}
#sprachwahl button{background:transparent;border:1px solid var(--linie);color:var(--gedaempft);
  padding:4px 11px;font-size:12px;letter-spacing:.06em}
#sprachwahl button.an{background:var(--signal);border-color:var(--signal);color:#101215}

header{padding:14px 0 22px}
.geraet{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.09em;
  color:var(--gedaempft);text-transform:uppercase;margin:0 0 12px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:clamp(34px,6vw,54px);line-height:1;letter-spacing:-.01em;
  margin:0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--signal)}
#intro{color:var(--gedaempft);margin:16px 0 0}
#intro b{color:var(--schrift)}

#leiste{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--linie);padding-bottom:22px}
#leiste div{flex:1;height:3px;background:var(--grafit-hell);border-radius:2px}
#leiste div.erledigt{background:var(--gut)}
#leiste div.hier{background:var(--signal)}
#leisteText{font-family:'JetBrains Mono',monospace;font-size:11.5px;
  color:var(--gedaempft);margin:10px 0 0;letter-spacing:.05em}

.seite{display:none;padding:26px 0 0}
.seite.sichtbar{display:block}
h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.02em;font-size:30px;margin:0 0 14px;font-weight:600}
h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.02em;font-size:22px;margin:34px 0 10px;font-weight:600}
p{margin:0 0 14px;color:var(--gedaempft)}
p b{color:var(--schrift)}
ol,ul{color:var(--gedaempft);padding-left:22px;margin:0 0 16px}
li{margin:7px 0} li b{color:var(--schrift)}

.weg{display:grid;grid-template-columns:26px 1fr;gap:12px;margin:0 0 14px;align-items:start}
.weg span{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
  color:#101215;background:var(--signal);border-radius:3px;text-align:center;
  line-height:20px;height:20px;margin-top:4px}
.weg p{margin:0}

.paar{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 18px;align-items:start}
.paar figure.bild{margin:0}
figure.bild.schmal{max-width:330px}
@media(max-width:620px){.paar{grid-template-columns:1fr}}
figure.bild{margin:0 0 18px;border:1px solid var(--linie);border-radius:var(--rand);
  overflow:hidden;background:var(--grafit-hell)}
figure.bild img{display:block;width:100%;height:auto}
figure.bild figcaption{padding:10px 14px;font-size:14.5px;color:var(--gedaempft);
  border-top:1px solid var(--linie)}
figure.bild figcaption b{color:var(--schrift)}

.kasten{border-left:2px solid var(--signal);padding:2px 0 2px 16px;margin:0 0 18px}
.kasten.achtung{border-color:var(--warn)}
.kasten p:last-child{margin:0}

button{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  letter-spacing:.04em;font-size:17px;font-weight:600;
  background:var(--signal);color:#101215;border:0;border-radius:var(--rand);
  padding:11px 22px;cursor:pointer;transition:filter .15s,transform .05s}
button:hover:not(:disabled){filter:brightness(1.12)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{background:var(--grafit-hell);color:#5a606a;cursor:not-allowed}
button.leise{background:transparent;color:var(--schrift);border:1px solid var(--linie)}
button.leise:hover:not(:disabled){border-color:var(--gedaempft);filter:none}
button:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.knopfreihe{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 0}
.navi{display:flex;justify-content:space-between;gap:10px;margin:28px 0 0;
  border-top:1px solid var(--linie);padding-top:20px}

.balken{height:3px;background:var(--grafit-hell);border-radius:2px;overflow:hidden;margin:16px 0 4px}
.balken i{display:block;height:100%;width:0;background:var(--signal);transition:width .2s}
.stand{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--gedaempft);min-height:1.4em}

#protokoll{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.75;
  background:#101216;border:1px solid var(--linie);border-radius:var(--rand);
  padding:13px 15px;max-height:220px;overflow:auto;white-space:pre-wrap;
  color:var(--gedaempft);margin:18px 0 0}
#protokoll b{color:var(--schrift);font-weight:400}
#protokoll .ok{color:var(--gut)} #protokoll .no{color:var(--warn)} #protokoll .tipp{color:#5aa9e6}

details{border:1px solid var(--linie);border-radius:var(--rand);margin:14px 0 0}
summary{cursor:pointer;padding:12px 16px;font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.03em;font-weight:600;font-size:16.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+ ';color:var(--signal);font-family:'JetBrains Mono',monospace}
details[open] summary::before{content:'– '}
details .inhalt{padding:0 15px 15px;color:var(--gedaempft);font-size:15.5px}
details .inhalt b{color:var(--schrift)}

.befehl{display:flex;gap:8px;margin:12px 0}
.befehl code{flex:1;background:#101216;border:1px solid var(--linie);border-radius:4px;
  padding:9px 12px;overflow-x:auto;white-space:nowrap;color:var(--schrift);font-size:12.5px}
.befehl button{padding:6px 12px;font-size:13px}

.melde{border-radius:var(--rand);padding:13px 16px;margin:0 0 18px;font-size:15px}
.melde.no{background:rgba(232,98,42,.12);border:1px solid var(--warn)}
.melde.ok{background:rgba(63,191,127,.1);border:1px solid var(--gut)}
.melde b{color:var(--schrift)}
ul.legende{list-style:none;padding:0;margin:0 0 16px}
ul.legende li{display:grid;grid-template-columns:14px 1fr;gap:12px;margin:0 0 12px;align-items:start}
ul.legende i{width:14px;height:14px;border-radius:3px;margin-top:5px;display:block}
.anno{display:grid;grid-template-columns:1fr minmax(0,420px) 1fr;margin:0 -50px 24px}
.anno img{width:100%;display:block;border-radius:4px}
.anno .sp{position:relative}
.anno .sp span{position:absolute;transform:translateY(-50%);font-size:14.5px;line-height:1.4;
  color:var(--gedaempft);display:block;width:100%}
.anno .sp span b{color:var(--schrift);display:block;font-weight:600}
.anno .li span{right:16px;text-align:right;padding-left:2px}
.anno .re span{left:16px;text-align:left;padding-right:2px}
.anno .sp span::after{content:'';position:absolute;top:50%;width:8px;height:2px;border-radius:1px;
  background:currentColor}
.anno .li span::after{right:-11px}
.anno .re span::after{left:-11px}
.anno .sp span.o{color:#fe7e27} .anno .sp span.g{color:#f5d90a}
.anno .sp span.r{color:#df2228} .anno .sp span.b{color:#6a78e0} .anno .sp span.n{color:#20b04e}
@media(max-width:860px){ .anno{margin:0 0 22px;grid-template-columns:1fr minmax(0,320px) 1fr} }
@media(max-width:760px){
  .anno{display:block}
  .anno .sp{margin:10px 0 0}
  .anno .sp span{position:static;transform:none;text-align:left!important;width:auto;
    padding:0 0 0 18px;margin:0 0 10px}
  .anno .sp span::after{left:0;top:8px;width:10px}
  .anno img{max-width:340px;margin:0 auto}
}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--linie);
  color:var(--gedaempft);font-size:13.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

de:{
 lang:'de',
 titel:'Colorimeter CR4501<br><em>RAL Hack</em>',
 intro:`Dein CR4501 misst Farben auf ein Hundertstel genau. Nur verrät es dir nicht,
   <i>welches RAL</i> das ist — dafür sollst du das Handy zücken und eine App öffnen.
   Draußen auf der Baustelle, mit Handschuhen, ist das keine gute Idee.
   Dieser Umbau bringt die Antwort dorthin, wo sie hingehört: <b>aufs Display</b>.
   Messen, ablesen, weiter.`,
 losGehts:'Los geht\'s',
 s0:`<h2>Was das bringt</h2>
   <figure class="bild"><img src="bilder/beispiel-7009.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Direkt nach der Messung:
     RAL 7009 Gruengrau, 96 % Übereinstimmung, dE 1,2.</figcaption></figure>
   <h3>Wie es ab Werk ist</h3>
   <p>Das CR4501 misst sauber und liefert dir L*a*b*, dE und einen Farbraumvergleich.
   Was es <b>nicht</b> tut: dir sagen, welcher RAL-Ton das ist. Dafür ist die Handy-App
   gedacht — Bluetooth koppeln, App öffnen, Messung übertragen. Auf der Baustelle, mit
   Handschuhen und bei Sonnenlicht, ist das umständlich bis unmöglich.</p>
   <h3>Wie es danach ist</h3>
   <p>Nach der Messung steht die Antwort <b>direkt auf dem Display</b>: RAL-Nummer, der
   deutsche Farbname, wie gut es passt, und der zweitbeste Treffer. Kein Handy, kein
   Koppeln, keine App. Und die Tasten links, rechts und Eingabe, die das Gerät auf den
   Messansichten sperrt, funktionieren wieder.</p>
   <h3>Was auf dem Display steht</h3>
   <div class="anno">
     <div class="sp li">
       <span class="o" style="top:30.8%"><b>Übereinstimmung</b>grün sicher, orange knapp</span>
       <span class="g" style="top:40.9%"><b>Zweitbester Treffer</b>mit seiner Prozentzahl</span>
     </div>
     <img src="bilder/anzeige-erklaert.jpg" alt="Display mit beschrifteten Werten">
     <div class="sp re">
       <span class="r" style="top:21.4%"><b>RAL-Nummer</b>Hintergrund zeigt die Farbe</span>
       <span class="b" style="top:32.1%"><b>dE · Farbabstand</b>unter 1 sieht man nichts</span>
       <span class="n" style="top:45.0%"><b>Farbname</b>deutsch, ohne Umlaute</span>
     </div>
   </div>
   <p>Zum <b>dE</b>: unter 1,0 sieht das Auge keinen Unterschied mehr, ab etwa 2 wird er
   sichtbar, über 5 ist es klar ein anderer Ton.</p>
   <div class="kasten achtung">
     <p><b>Die Prozentzahl wechselt die Farbe.</b> Normalerweise ist sie grün hinterlegt.
     Liegen erster und zweiter Treffer aber <b>weniger als 4 % auseinander</b>, wird sie
     <b>orange</b> — das ist der Hinweis des Geräts, dass es sich nicht sicher ist.</p>
     <p>Dann sind sich die beiden Töne tatsächlich so ähnlich, dass die Messung allein
     nicht entscheiden kann. In dem Fall nimmst du den Fächer und hältst beide Kandidaten
     daneben.</p>
   </div>
   <div class="paar">
     <figure class="bild"><img src="bilder/messen-faecher.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Direkt auf dem Fächer gemessen —
     die Nummer steht auf dem Display, der Fächer nur noch zur Kontrolle.</figcaption></figure>
     <figure class="bild"><img src="bilder/beispiel-1011.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>RAL 1011 Braunbeige, 97 %,
     dE 0,9 — der Zweitplatzierte liegt mit 55 % weit zurück, da gibt es nichts zu
     überlegen.</figcaption></figure>
   </div>

   <div class="paar">
     <figure class="bild"><img src="bilder/beispiel-1006.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>RAL 1006 Maisgelb, 92 %,
     dE 2,2 — der Ton stimmt, aber der Abstand ist schon zu sehen. Hier lohnt der Blick
     in den Fächer.</figcaption></figure>
     <figure class="bild"><img src="bilder/werk-lab.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Und so sieht dasselbe Gerät ab Werk
     aus: L*, a*, b* — und sonst nichts. Welcher RAL-Ton das ist, sagt es dir
     nicht.</figcaption></figure>
   </div>

   <h3>Was es nicht kann</h3>
   <ul>
     <li><b>Nur RAL Classic.</b> Die 216 Töne von RAL 1000 bis 9023. Kein RAL Design,
       kein NCS, kein Pantone — dafür ist im Speicher kein Platz.</li>
     <li><b>Die Werte stammen von einem Fächer und einem Gerät.</b> Fächer vergilben,
       jedes Messgerät hat seine eigene Kalibrierung. Für „welcher RAL-Ton ist das
       ungefähr" reicht das gut. Für eine Abnahme oder einen Reklamationsfall nimmst du
       weiterhin den Fächer in die Hand.</li>
     <li><b>Glanz und Struktur stören.</b> Bei Hochglanz oder grober Struktur streuen die
       Messwerte, dann sinkt die Prozentzahl — das Gerät ist ehrlich, nicht kaputt.</li>
     <li><b>Metallic und Effektlacke</b> funktionieren grundsätzlich nicht, weder mit noch
       ohne diesen Umbau.</li>
   </ul>
   <h3>Und die Risiken</h3>
   <p>Ehrlich, ohne Schönfärberei:</p>
   <ul>
     <li><b>Es ist ein Eingriff in die Gerätefirmware.</b> Deine Garantie interessiert das
       vermutlich, falls sie noch läuft.</li>
     <li><b>Die Kalibrierung bleibt unberührt.</b> Das Werkzeug schreibt ausschließlich in
       den Programmbereich und verweigert jeden Zugriff auf den Speicher ab
       <code>0x08030000</code>, wo Startbild, Einstellungen und die Werkskalibrierung
       liegen. Das ist fest im Code, nicht bloß eine Absichtserklärung.</li>
     <li><b>Vor dem ersten Schreibvorgang wird deine Firmware gesichert</b> und dir als
       Datei gegeben. Damit kommst du jederzeit zurück.</li>
     <li><b>Ein abgebrochener Schreibvorgang macht das Gerät nicht kaputt.</b> Der
       Bootloader liegt in einem eigenen Bereich, den nichts überschreiben kann — du
       kommst immer wieder in den Aktualisierungsmodus.</li>
     <li><b>Trotzdem:</b> Das ist ein Bastelprojekt, kein geprüftes Produkt. Wenn dein
       Gerät im täglichen Einsatz Geld verdient, überleg dir, ob du das jetzt machen
       willst.</li>
   </ul>
   <p>Der ganze Vorgang dauert etwa fünf Minuten und lässt sich vollständig rückgängig
   machen.</p>`,

 s1:`<h2>Gerät in den Aktualisierungsmodus</h2>
   <p>Der einzige Handgriff, der etwas Gefühl braucht. Beim ersten Mal klappt er selten
   auf Anhieb — das ist normal, probier ihn ruhig zwei-, dreimal.</p>
   <p><b>Zuerst ausschalten:</b> Messtaste lange gedrückt halten, bis das Gerät ausgeht.
   Dann <b>mindestens fünf Sekunden</b> nichts anfassen. Ohne diese Pause reagiert es
   nicht — sie ist nicht optional.</p>
   <p>Und dann einer der beiden Wege:</p>
   <div class="weg"><span>A</span><p>Messtaste wieder lange halten, bis der Ring um die
     Taste <b>rot blinkt</b>. In dem Moment sofort loslassen.</p></div>
   <div class="weg"><span>B</span><p>Messtaste und Eingabetaste zusammen — die Wippe dafür
     in der Mitte hineindrücken. Das rote Blinken kommt sofort, gleich loslassen.</p></div>
   <div class="paar">
     <figure class="bild"><img src="bilder/dfu-druecken.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Weg A: halten, bis der Ring rot
     wird — und dann sofort loslassen.</figcaption></figure>
     <figure class="bild"><img src="bilder/dfu-modus.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>So sieht es aus, wenn es
     geklappt hat.</figcaption></figure>
   </div>

   <div class="kasten"><p><b>Der Bildschirm bleibt dunkel.</b> Das ist kein Fehler, im
     Aktualisierungsmodus zeigt das Gerät nichts an. Nur der Ring blinkt.</p></div>
   <p>Jetzt per USB an den Rechner.</p>
   <figure class="bild"><img src="bilder/usb-anstecken.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Nimm ein Kabel, mit dem schon
     einmal Daten übertragen wurden. Reine Ladekabel gibt es öfter, als man denkt.</figcaption></figure>`,
 s2win:`<h2>Windows braucht einen Treiber</h2>
   <p>Einmalig, und danach nie wieder. Windows bringt für den Aktualisierungsmodus keinen
   Treiber mit, den ein Browser ansprechen darf. Das erledigt <b>Zadig</b> — eine einzelne
   Datei, keine Installation.</p>
   <div class="kasten"><p><b>Hast du das Gerät schon mit dfu-util benutzt?</b> Dann ist
   wahrscheinlich alles da. Geh einfach weiter und komm nur hierher zurück, falls das
   Gerät nicht in der Liste auftaucht.</p></div>
   <div class="paar">
     <figure class="bild"><img src="bilder/geraetemanager-fehlt.png" alt=""
     onerror="this.closest('figure').remove()"><figcaption>So sieht es <b>ohne</b> Treiber
     aus: im Geräte-Manager unter „Andere Geräte", mit Warnzeichen.</figcaption></figure>
     <figure class="bild"><img src="bilder/zadig-download.png" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Unter <b>Download</b> die
     aktuelle Version.</figcaption></figure>
   </div>
   <p><a href="https://zadig.akeo.ie" target="_blank" rel="noopener">zadig.akeo.ie öffnen
   und herunterladen</a></p>

   <ol>
     <li>Gerät im Aktualisierungsmodus anstecken — der Ring muss rot blinken</li>
     <li>Zadig starten, im Menü <b>Options → List All Devices</b> anhaken</li>
     <li>Oben <b>STM32 DownLoad Firmware Update</b> auswählen. Zur Kontrolle steht
       darunter <code>USB ID 0483 DF11</code></li>
     <li>Rechts daneben <b>WinUSB</b> einstellen</li>
     <li><b>Install Driver</b> klicken und warten</li>
   </ol>
   <div class="paar">
     <figure class="bild"><img src="bilder/zadig-winusb.png" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Oben das Gerät, darunter
     <b>0483 DF11</b>, rechts <b>WinUSB</b>.</figcaption></figure>
     <figure class="bild"><img src="bilder/zadig-installiert.png" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Dauert ein paar Sekunden.
     Nicht abbrechen.</figcaption></figure>
   </div>

   <div class="kasten achtung"><p><b>Unbedingt WinUSB.</b> Nicht libusbK, nicht
   libusb-win32. Die funktionieren mit dfu-util, aber der Browser sieht das Gerät damit
   nicht — das ist hier der häufigste Fehler.</p></div>
   <figure class="bild"><img src="bilder/geraetemanager-gut.png" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Danach steht das Gerät unter
     <b>USB-Geräte</b>. So gehört es sich.</figcaption></figure>
   <div class="kasten"><p><b>Zum Schluss die Seite neu laden.</b> Der Browser merkt sich
   beim Öffnen, welche USB-Geräte er ansprechen darf — wechselt zwischendurch der Treiber,
   bekommt die offene Seite das nicht mit. Nach dem Neuladen landest du automatisch wieder
   hier.</p>
   <div class="knopfreihe"><button id="btnNeuLaden"></button></div></div>`,
 s2linux:`<h2>Kurz eine Zugriffsregel</h2>
   <p>Unter Linux braucht es keinen Treiber, nur eine Regel — sonst gehört das Gerät root
   und der Browser kommt nicht heran.</p>
   <div class="befehl"><code>echo 'SUBSYSTEM=="usb", ATTR{idVendor}=="0483", ATTR{idProduct}=="df11", MODE="0666"' | sudo tee /etc/udev/rules.d/50-stm32-dfu.rules &amp;&amp; sudo udevadm control --reload-rules</code>
   <button class="leise kopieren" data-text='echo &apos;SUBSYSTEM=="usb", ATTR{idVendor}=="0483", ATTR{idProduct}=="df11", MODE="0666"&apos; | sudo tee /etc/udev/rules.d/50-stm32-dfu.rules &amp;&amp; sudo udevadm control --reload-rules'></button></div>
   <p>Danach das Gerät einmal abziehen und wieder anstecken.</p>`,
 s2mac:`<h2>Hier gibt es nichts zu tun</h2>
   <div class="melde ok"><b>Unter macOS ist kein Treiber nötig.</b> Chrome spricht das
   Gerät direkt an — geh einfach weiter.</div>`,
 s2andere:`<h2>Treiber</h2>
   <p>Auf diesem System ist meist nichts nötig. Sollte das Gerät im nächsten Schritt nicht
   in der Liste stehen, fehlen die Zugriffsrechte für USB-Geräte.</p>`,
 s3:`<h2>Sichern und einspielen</h2>
   <p>Drei Knöpfe, einer nach dem anderen. Gesichert wird <b>zuerst</b> — erst danach
   wird überhaupt etwas geschrieben. Falls unterwegs etwas schiefgeht, hast du deine
   Firmware also schon in der Hand.</p>
   <div class="kasten achtung">
     <p><b>Das Gerät muss dafür noch im Aktualisierungsmodus stecken:</b> Ring blinkt rot,
     Bildschirm bleibt dunkel. Hast du es zwischendurch neu gestartet oder abgesteckt,
     bring es nochmal hinein — zurück auf Schritt 2.</p>
   </div>
   <figure class="bild schmal"><img src="bilder/dfu-modus.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>So muss es aussehen, bevor du
     unten auf Gerät suchen klickst.</figcaption></figure>`,
 s3bild:`<figure class="bild"><img src="bilder/browser-auswahl.png" alt=""
   onerror="this.closest('figure').remove()"><figcaption><b>So muss es aussehen:</b> Die
   Zeile mit dem Gerät ist angeklickt und blau hinterlegt, dann ist <b>Verbinden</b>
   aktiv. Ohne Anklicken bleibt der Knopf grau — daran scheitern die meisten.</figcaption></figure>`,
 s4:`<h2>Geschafft — jetzt ausprobieren</h2>
   <div class="melde ok"><b>Die Erweiterung ist eingespielt und zurückgelesen geprüft.</b></div>
   <p><b>Gerät neu starten:</b> USB abziehen, Messtaste kurz drücken. Es startet ganz
   normal, das Startbild ist unverändert — von außen sieht man dem Gerät nichts an.</p>
   <p><b>Ausprobieren:</b> Eine Messung auf irgendeiner Fläche machen. Dann mit der
   <b>Eingabetaste</b> durch die Ansichten schalten. Eine davon zeigt jetzt die RAL-Nummer
   mit Namen und wie gut sie passt.</p>
   <figure class="bild"><img src="bilder/ral-anzeige.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>So sieht die neue Ansicht
     aus.</figcaption></figure>
   <p>Nebenbei tun jetzt auch links, rechts und die Eingabetaste das, was man von ihnen
   erwartet — die Werksfirmware sperrt sie auf den Messansichten.</p>
   <h3>Falls du es rückgängig machen willst</h3>
   <p>Gerät wieder in den Aktualisierungsmodus bringen, hier verbinden, dann die
   gesicherte Datei einspielen. Danach ist alles wie vorher.</p>`,
 s4b:`<div class="kasten achtung"><p><b>Bricht ein Schreibvorgang ab, ist das Gerät nicht
   kaputt.</b> Der Bootloader liegt in einem eigenen Speicherbereich, den niemand
   beschreiben kann — du kommst immer wieder in den Aktualisierungsmodus und kannst deine
   Sicherung einspielen.</p></div>
   <details><summary>Ohne Browser, mit dfu-util</summary><div class="inhalt">
   <div class="befehl"><code>dfu-util -a 0 -s 0x08004000 -D deine_sicherung.bin</code>
   <button class="leise kopieren" data-text="dfu-util -a 0 -s 0x08004000 -D deine_sicherung.bin"></button></div>
   <p>Niemals die Option <code>-t</code> verwenden und immer den ganzen Bereich am Stück
   schreiben — der Bootloader löscht beim ersten Schreibbefehl alles und erwartet danach
   das vollständige Abbild.</p></div></details>`,
 fuss:`Ein Feierabendprojekt, kein Produkt von 3nh. Die Kalibrierung deines Geräts bleibt
   unberührt — alles ab <code>0x08030000</code> wird nicht angefasst.
   <br><a href="https://github.com/hallko1234/cr4501-ral">Quelltext und Dokumentation</a>`,

en:{
 lang:'en',
 titel:'Colorimeter CR4501<br><em>RAL Hack</em>',
 intro:`Your CR4501 measures colour down to a hundredth. It just won't tell you
   <i>which RAL</i> that is — for that you're meant to pull out your phone and open an app.
   On site, with gloves on, that's a poor idea. This modification puts the answer where it
   belongs: <b>on the device's own screen</b>. Measure, read, move on.`,
 losGehts:'Let\'s go',
 s0:`<h2>What you get</h2>
   <figure class="bild"><img src="bilder/beispiel-7009.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Straight after a measurement:
     RAL 7009 Gruengrau, 96 % match, dE 1.2.</figcaption></figure>
   <h3>How it is out of the box</h3>
   <p>The CR4501 measures cleanly and gives you L*a*b*, dE and a colour space comparison.
   What it does <b>not</b> do is tell you which RAL tone that is. The phone app is meant
   for that — pair Bluetooth, open the app, transfer the reading. On site, with gloves on
   and sunlight on the screen, that ranges from awkward to impossible.</p>
   <h3>How it is afterwards</h3>
   <p>After a measurement the answer sits <b>right on the display</b>: RAL number, the
   colour name, how well it matches, and the runner-up. No phone, no pairing, no app.
   And the left, right and enter buttons — locked out by the factory firmware on the
   measurement screens — work again.</p>
   <h3>What the display shows</h3>
   <div class="anno">
     <div class="sp li">
       <span class="o" style="top:30.8%"><b>Match</b>green certain, orange close</span>
       <span class="g" style="top:40.9%"><b>Runner-up</b>with its own percentage</span>
     </div>
     <img src="bilder/anzeige-erklaert.jpg" alt="Display with the values labelled">
     <div class="sp re">
       <span class="r" style="top:21.4%"><b>RAL number</b>background shows the colour</span>
       <span class="b" style="top:32.1%"><b>dE · colour distance</b>below 1 you see nothing</span>
       <span class="n" style="top:45.0%"><b>Colour name</b>German, without umlauts</span>
     </div>
   </div>
   <p>About <b>dE</b>: below 1.0 the eye sees no difference, from about 2 it becomes
   visible, above 5 it is clearly a different tone.</p>
   <div class="kasten achtung">
     <p><b>The percentage changes colour.</b> Normally it sits on green. But when the first
     and second match are <b>less than 4 % apart</b>, it turns <b>orange</b> — that is the
     device telling you it isn't sure.</p>
     <p>Those two tones really are that close, and the measurement alone cannot decide.
     Reach for the fan deck and hold both candidates against the surface.</p>
   </div>
   <div class="paar">
     <figure class="bild"><img src="bilder/messen-faecher.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Measured straight off the fan
     deck — the number is on the display, the deck is only there to check.</figcaption></figure>
     <figure class="bild"><img src="bilder/beispiel-1011.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>RAL 1011 Braunbeige, 97 %,
     dE 0.9 — the runner-up trails far behind at 55 %, nothing to think about
     here.</figcaption></figure>
   </div>

   <div class="paar">
     <figure class="bild"><img src="bilder/beispiel-1006.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>RAL 1006 Maisgelb, 92 %,
     dE 2.2 — the tone is right, but the distance is already visible. Worth checking the
     fan deck.</figcaption></figure>
     <figure class="bild"><img src="bilder/werk-lab.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>And the same device as it ships:
     L*, a*, b* — and nothing else. It won't tell you which RAL that
     is.</figcaption></figure>
   </div>

   <h3>What it cannot do</h3>
   <ul>
     <li><b>RAL Classic only.</b> The 216 tones from RAL 1000 to 9023. No RAL Design, no
       NCS, no Pantone — there is no room in memory for those.</li>
     <li><b>The values come from one fan deck and one device.</b> Fan decks yellow with
       age, every instrument has its own calibration. For „roughly which RAL is this" that
       is plenty. For sign-off or a complaint, reach for the fan deck.</li>
     <li><b>Gloss and texture interfere.</b> On high gloss or coarse texture the readings
       scatter and the percentage drops — the device is being honest, not broken.</li>
     <li><b>Metallic and effect paints</b> don't work at all, with or without this
       modification.</li>
   </ul>
   <h3>And the risks</h3>
   <p>Honestly, no sugar-coating:</p>
   <ul>
     <li><b>This modifies the device firmware.</b> Your warranty will probably care, if
       you still have one.</li>
     <li><b>Calibration stays untouched.</b> The tool writes only to the program area and
       refuses any access to memory above <code>0x08030000</code>, where the splash screen,
       settings and factory calibration live. That is enforced in code, not just
       promised.</li>
     <li><b>Your firmware is backed up before anything is written</b> and handed to you as
       a file. That is your way back, any time.</li>
     <li><b>An aborted write does not brick the device.</b> The bootloader lives in its own
       region that nothing can overwrite — you can always get back into update mode.</li>
     <li><b>Even so:</b> this is a hobby project, not a certified product. If your device
       earns money every day, think about whether you want to do this now.</li>
   </ul>
   <p>The whole thing takes about five minutes and is fully reversible.</p>`,

 hilfeFindenTitel:'The device list is empty',
 hilfeFinden:`<ol>
   <li><b>Is the ring flashing red?</b> If not, the device isn't in update mode — back to
     step 2.</li>
   <li><b>Released too late?</b> The moment it flashes red, let go. Hold longer and the
     device just boots normally.</li>
   <li><b>Charge-only cable.</b> Plenty of USB cables carry power only. Use one you've
     transferred data with before.</li>
   <li><b>USB hub in between.</b> Plug straight into the computer.</li>
   <li><b>Driver</b> — back to step 3.</li></ol>`,
 s1:`<h2>Put the device into update mode</h2>
   <p>The one step that takes a bit of feel. It rarely works first try — that's normal,
   just have another go.</p>
   <p><b>Switch it off first:</b> hold the measure button until the device turns off.
   Then <b>wait at least five seconds</b> without touching anything. Without that pause it
   won't respond — this isn't optional.</p>
   <p>Then either way works:</p>
   <div class="weg"><span>A</span><p>Hold the measure button again until the ring around it
     <b>flashes red</b>. Let go immediately at that moment.</p></div>
   <div class="weg"><span>B</span><p>Press the measure button and the enter button together —
     push the rocker in at its centre. The red flash comes right away; let go at once.</p></div>
   <div class="paar">
     <figure class="bild"><img src="bilder/dfu-druecken.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Option A: hold until the ring
     turns red — then let go straight away.</figcaption></figure>
     <figure class="bild"><img src="bilder/dfu-modus.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>This is what it looks like when
     it worked.</figcaption></figure>
   </div>

   <div class="kasten"><p><b>The screen stays dark.</b> Nothing is wrong — in update mode
     the device displays nothing at all. Only the ring flashes.</p></div>
   <p>Now plug it into the computer.</p>
   <figure class="bild"><img src="bilder/usb-anstecken.jpg" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Use a cable you've transferred
     data with before. Charge-only cables are more common than you'd think.</figcaption></figure>`,
 s2win:`<h2>Windows needs a driver</h2>
   <p>Once, and never again. Windows ships no driver for update mode that a browser is
   allowed to talk to. <b>Zadig</b> sorts that out — a single file, no installation.</p>
   <div class="kasten"><p><b>Have you used the device with dfu-util before?</b> Then it's
   probably already set up. Just carry on, and only come back here if the device doesn't
   show up in the list.</p></div>
   <div class="paar">
     <figure class="bild"><img src="bilder/geraetemanager-fehlt.png" alt=""
     onerror="this.closest('figure').remove()"><figcaption>This is what it looks like
     <b>without</b> the driver: under „Other devices" with a warning mark.</figcaption></figure>

   </div>
   <p><a href="https://zadig.akeo.ie" target="_blank" rel="noopener">Open zadig.akeo.ie and

     <li>Plug in the device in update mode — the ring must be flashing red</li>
     <li>Start Zadig, tick <b>Options → List All Devices</b></li>
     <li>Pick <b>STM32 DownLoad Firmware Update</b> at the top. To check, it shows

   </div>

   <div class="kasten achtung"><p><b>It must be WinUSB.</b> Not libusbK, not libusb-win32.

   <figure class="bild"><img src="bilder/geraetemanager-gut.png" alt=""
     onerror="this.closest('figure').remove()"><figcaption>Afterwards the device sits under
     <b>USB devices</b>. That's how it should be.</figcaption></figure>
   <div class="kasten"><p><b>Finally, reload this page.</b> The browser decides at load time
   which USB devices it may talk to — if the driver changes in between, the open page never
   finds out. After reloading you'll land right back here.</p>
   <div class="knopfreihe"><button id="btnNeuLaden"></button></div></div>`,
 s2linux:`<h2>Just one access rule</h2>
   <p>No driver needed on Linux, only a rule — otherwise the device belongs to root and the
   browser can't reach it.</p>
   <div class="befehl"><code>echo 'SUBSYSTEM=="usb", ATTR{idVendor}=="0483", ATTR{idProduct}=="df11", MODE="0666"' | sudo tee /etc/udev/rules.d/50-stm32-dfu.rules &amp;&amp; sudo udevadm control --reload-rules</code>
   <button class="leise kopieren" data-text='echo &apos;SUBSYSTEM=="usb", ATTR{idVendor}=="0483", ATTR{idProduct}=="df11", MODE="0666"&apos; | sudo tee /etc/udev/rules.d/50-stm32-dfu.rules &amp;&amp; sudo udevadm control --reload-rules'></button></div>
   <p>Then unplug the device once and plug it back in.</p>`,

 s3:`<h2>Back up and flash</h2>

 s4:`<h2>Done — now try it</h2>
   <div class="melde ok"><b>The extension is flashed and verified by reading it back.</b></div>
   <p><b>Restart the device:</b> unplug USB, tap the measure button. It boots completely

   <p><b>Try it:</b> take a measurement of any surface. Then cycle through the views with

     onerror="this.closest('figure').remove()"><figcaption>The new view.</figcaption></figure>
   <p>As a bonus, left, right and the enter button now do what you'd expect — the factory

   <h3>If you want to undo it</h3>

 s4b:`<div class="kasten achtung"><p><b>If a write aborts halfway, the device isn't
   bricked.</b> The bootloader lives in its own memory area that nothing can overwrite — you
   can always get back into update mode and restore your backup.</p></div>
   <details><summary>Without a browser, using dfu-util</summary><div class="inhalt">
   <div class="befehl"><code>dfu-util -a 0 -s 0x08004000 -D your_backup.bin</code>
   <button class="leise kopieren" data-text="dfu-util -a 0 -s 0x08004000 -D your_backup.bin"></button></div>
   <p>Never use the <code>-t</code> option, and always write the whole region in one go —

let L=T.de;

/* ================== System ================== */
function systemErkennen(){
  const ua=navigator.userAgent,d=navigator.userAgentData;
  const p=(d&&d.platform)||navigator.platform||'';
  let os='andere';
  if(/Win/i.test(p)||/Windows/i.test(ua)) os='windows';
  else if(/iPhone|iPad/i.test(ua)) os='ios';
  else if(/Mac/i.test(p)||/Macintosh/i.test(ua)) os='macos';
  else if(/Android/i.test(ua)) os='android';
  else if(/Linux|X11/i.test(p)) os='linux';
  let br='andere';
  if(/Edg\//.test(ua)) br='edge'; else if(/OPR\//.test(ua)) br='opera';
  else if(/Firefox\//.test(ua)) br='firefox'; else if(/Chrome\//.test(ua)) br='chrome';
  else if(/Safari\//.test(ua)) br='safari';
  return {os,br,webusb:('usb' in navigator),
    sicher:(location.protocol==='https:'||location.hostname==='localhost')};
}
const SYS=systemErkennen();

/* ================== Anzeige ================== */
const TITEL=()=>L.schritte;
let seite=1;
function zeigeSeite(n){
  seite=n;
  document.querySelectorAll('.seite').forEach((s,i)=>s.classList.toggle('sichtbar',i+1===n));
  document.querySelectorAll('#leiste div').forEach((d,i)=>
    d.className=i+1<n?'erledigt':(i+1===n?'hier':''));
  $('#leisteText').textContent=L.schrittText(n,TITEL()[n-1]);
  $('#intro').style.display = n===1 ? '' : 'none';   // Einleitung nur auf der Startseite
  if(n===5){
    const m=$('#melde4');
    if(geraet&&geraet.opened){
      m.textContent=L.verbundenMit(geraet.productName||'DFU',geraet.serialNumber||'?');
      $('#btnZurueck').disabled=false; $('#btnVerbinden4').disabled=true;
    }else{
      m.textContent=L.keinGeraet2;
      $('#btnZurueck').disabled=true; $('#btnVerbinden4').disabled=false;
    }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
const prot=$('#protokoll');
function sag(text,art){
  const z=document.createElement('b'); if(art) z.className=art;
  z.textContent=new Date().toTimeString().slice(0,8)+'  '+text+'\n';
  prot.appendChild(z); prot.scrollTop=prot.scrollHeight;
}
const tipp=t=>sag('        '+t,'tipp');
const fort=(id,a)=>$(id).style.width=Math.round(a*100)+'%';
const stand=(id,t)=>$(id).textContent=t;

  document.querySelectorAll('.kopieren').forEach(b=>b.textContent=L.kopieren);
  const kn=$('#btnNeuLaden');
  if(kn){ kn.textContent=L.neuLaden;

  if(!$('#melde4').textContent||$('#melde4').dataset.leer!=='0') $('#melde4').textContent=L.keinGeraet;
  browserPruefen();

}
function browserPruefen(){
  const w=$('#browserWarnung');
  if(SYS.webusb&&SYS.sicher){ w.innerHTML=''; $('#w1').disabled=false; return; }
  let t;
  if(!SYS.sicher) t=L.wKeinHttps;
  else if(SYS.os==='ios') t=L.wIos;
  else if(SYS.br==='firefox'||SYS.br==='safari') t=L.wFalscherBrowser;
  else t=L.wKeinUsb;
  w.innerHTML='<div class="melde no">'+t+'</div>';
  $('#w1').disabled=true;
}
function sprache(l){
  L=T[l];
  $('#spDe').className=l==='de'?'an':'';
  $('#spEn').className=l==='en'?'an':'';
  try{ sessionStorage.setItem('cr_sprache',l); }catch(e){}
  texteSetzen();
}

/* ================== Farbstreifen ================== */
function streifenZeichnen(){
  const roh=Uint8Array.from(atob(DATEN.blobs[1].b64),c=>c.charCodeAt(0));
  const v=new DataView(roh.buffer), n=v.getUint32(8,true), ziel=$('#streifen');
  for(let i=0;i<n;i++){
    const rgb=v.getUint16(0x40+i*10+8,true);
    const d=document.createElement('div');
    d.style.background=`rgb(${((rgb>>11)&31)*255/31|0},${((rgb>>5)&63)*255/63|0},${(rgb&31)*255/31|0})`;
    ziel.appendChild(d);
  }
  return n;
}
const ANZAHL=streifenZeichnen();

/* ================== DfuSe ================== */
const DNLOAD=1,UPLOAD=2,GETSTATUS=3,CLRSTATUS=4,ABORT=6;
let geraet=null,schnittstelle=0,blockgroesse=1024,original=null,dateiname='',
    laeuft=false,etwasVeraendert=false;

async function raus(b,w,d){
  const r=await geraet.controlTransferOut(
    {requestType:'class',recipient:'interface',request:b,value:w,index:schnittstelle},d);
  if(r.status!=='ok') throw new Error(L.eAbgewiesen(r.status));
}
async function rein(b,w,l){
  const r=await geraet.controlTransferIn(
    {requestType:'class',recipient:'interface',request:b,value:w,index:schnittstelle},l);
  if(r.status!=='ok') throw new Error(L.eKeineAntwort(r.status));
  return new Uint8Array(r.data.buffer);
}
async function status(){const s=await rein(GETSTATUS,0,6);
  return {fehler:s[0],warten:s[1]|(s[2]<<8)|(s[3]<<16),zustand:s[4]};}
async function warten(){
  let s=await status();
  while(s.zustand===4||s.zustand===3){await schlafen(Math.max(s.warten,1)); s=await status();}
  if(s.fehler!==0){const t=L.fehler[s.fehler]||('Code '+s.fehler);
    await raus(CLRSTATUS,0,new Uint8Array()); throw new Error(L.eGeraetMeldet(t));}
  return s;
}
async function abbrechen(){await raus(ABORT,0,new Uint8Array()); await status();}
async function zurueckAufLeerlauf(){
  await raus(ABORT,0,new Uint8Array());
  const s=await status();
  if(s.zustand!==2) throw new Error(L.eZustand(s.zustand));
}
async function zeigerSetzen(a){
  const b=new Uint8Array(5); b[0]=0x21; new DataView(b.buffer).setUint32(1,a,true);
  await raus(DNLOAD,0,b); await warten(); await zurueckAufLeerlauf();
}
async function seiteLoeschen(a){
  if(a>=GRENZE) throw new Error(L.eSperre(hex(a)));
  const b=new Uint8Array(5); b[0]=0x41; new DataView(b.buffer).setUint32(1,a,true);
  await raus(DNLOAD,0,b); await warten(); await zurueckAufLeerlauf();
}
async function lesen(adr,len,melde){
  await abbrechen(); await zeigerSetzen(adr);
  const aus=new Uint8Array(len); let g=0,bl=2;
  while(g<len){
    const s=await rein(UPLOAD,bl++,Math.min(blockgroesse,len-g));
    if(s.length===0) break;
    aus.set(s,g); g+=s.length;
    if(melde) melde(g/len,g);
  }
  if(g!==len) throw new Error(L.eNurGelesen(g,len));
  await zurueckAufLeerlauf();
  return aus;
}
async function schreiben(adr,daten,melde){
  if(adr+daten.length>GRENZE) throw new Error(L.eSperre2(hex(GRENZE)));
  await zurueckAufLeerlauf();
  const seiten=Math.ceil(daten.length/SEITE);
  sag(L.mLoesche(seiten));
  let n=0;
  for(let a=adr;a<adr+daten.length;a+=SEITE){
    await seiteLoeschen(a); etwasVeraendert=true; n++;
    if(melde) melde(.35*n/seiten,L.statLoeschen(n,seiten));
  }
  await abbrechen(); await zeigerSetzen(adr);
  sag(L.mSchreibe(daten.length));
  let g=0,bl=2;
  while(g<daten.length){
    const s=daten.subarray(g,g+blockgroesse);
    await raus(DNLOAD,bl++,s); await warten(); g+=s.length;
    if(melde) melde(.35+.65*g/daten.length,L.statSchreiben(g,daten.length));
  }
}
function fehlerhilfe(e){
  const m=(e&&e.message)||String(e);
  if(/nicht|not responding|rejected|abgewiesen|transfer/i.test(m)){
    tipp(L.mTippModus); tipp(L.mTippModus2);
  }else if(/NetworkError|disconnect/i.test(m)) tipp(L.mTippKabel);
}
function sicherungSpeichern(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([original],{type:'application/octet-stream'}));
  a.download=dateiname; a.click();
}

/* ================== Ablauf ================== */
async function verbinden(){
  sag(L.mSuche);
  geraet=await navigator.usb.requestDevice({filters:[{vendorId:0x0483,productId:0xdf11}]});
  await geraet.open();
  if(!geraet.configuration) await geraet.selectConfiguration(1);
  const s=geraet.configuration.interfaces[0];
  schnittstelle=s.interfaceNumber;
  await geraet.claimInterface(schnittstelle);
  await geraet.selectAlternateInterface(schnittstelle,0);
  await abbrechen();
  const bez=(s.alternates[0]&&s.alternates[0].interfaceName)||'';
  sag(L.mVerbunden(geraet.productName||'DFU'),'ok');
  sag(L.mSeriennummer(geraet.serialNumber||'?'));
  if(bez) sag(L.mSpeicher(bez));
  return L.verbundenMit(geraet.productName||'DFU',geraet.serialNumber||'?');
}
function verbindungsfehler(e){
  if(e&&e.name==='NotFoundError'){
    sag(L.mKeinGeraet,'no'); tipp(L.mTippAnklicken); tipp(L.mTippLeer);
    $('#hilfeFinden').open=true;
    return L.mKeinGeraet;
  }
  const t=L.mVerbindenFehler((e&&e.message)||e);
  sag(t,'no'); fehlerhilfe(e); return t;
}
$('#btnVerbinden').onclick=async()=>{
  try{ await verbinden(); $('#hilfeFinden').open=false;
    $('#btnVerbinden').disabled=true; $('#btnSichern').disabled=false;
  }catch(e){ verbindungsfehler(e); }
};
$('#btnVerbinden4').onclick=async()=>{
  const m=$('#melde4'); m.dataset.leer='0';
  try{ m.textContent=await verbinden();
    $('#btnZurueck').disabled=false; $('#btnVerbinden4').disabled=true;
  }catch(e){ m.textContent=verbindungsfehler(e); }
};
$('#btnDirektZurueck').onclick=()=>zeigeSeite(5);
$('#wStart').onclick=()=>zeigeSeite(2);
$('#w1').onclick=()=>zeigeSeite(3);
$('#w2').onclick=()=>zeigeSeite(4);
$('#w3').onclick=()=>zeigeSeite(5);
document.addEventListener('click',ev=>{
  const z=ev.target.closest('[data-zurueck]'); if(z) zeigeSeite(+z.dataset.zurueck);
  const k=ev.target.closest('.kopieren');
  if(k) navigator.clipboard.writeText(k.dataset.text).then(()=>{
    const a=k.textContent; k.textContent='✓'; setTimeout(()=>k.textContent=a,1400);});
});

$('#btnSichern').onclick=async()=>{
  if(laeuft) return; laeuft=true; $('#btnSichern').disabled=true;
  try{
    sag(L.mLese(APP_LAENGE));
    original=await lesen(APP_START,APP_LAENGE,(a,g)=>{
      fort('#fortSichern',a); stand('#standSichern',L.statBytes(g,APP_LAENGE));});
    dateiname='cr4501_original_'+(geraet.serialNumber||'x')+'_'+
      new Date().toISOString().slice(0,10)+'.bin';
    sicherungSpeichern();
    sag(L.mGesichert(dateiname),'ok'); tipp(L.mTippHeben);
    stand('#standSichern',L.statFertig(APP_LAENGE));
    $('#btnSchreiben').disabled=false;
  }catch(e){ sag(L.mLesenFehler((e&&e.message)||e),'no'); fehlerhilfe(e);
    $('#btnSichern').disabled=false; }
  laeuft=false;
};

$('#btnSchreiben').onclick=async()=>{
  if(laeuft) return; laeuft=true; $('#btnSchreiben').disabled=true;
  try{
    if(!original) throw new Error(L.eErstSichern);
    const neu=new Uint8Array(original);
    const bytes=s=>Uint8Array.from(s.match(/../g).map(h=>parseInt(h,16)));
    sag(L.mPruefe);
    for(const p of DATEN.patches){
      const off=p.addr-APP_START, soll=bytes(p.alt), ist=neu.subarray(off,off+4);
      if(!soll.every((v,i)=>v===ist[i])){
        const g=[...ist].map(b=>b.toString(16).padStart(2,'0')).join('');
        if(g===p.neu) throw new Error(L.eSchonDrauf);
        throw new Error(L.eUnbekannt(hex(p.addr),g,p.alt));
      }
    }
    for(const b of DATEN.blobs){
      const roh=Uint8Array.from(atob(b.b64),c=>c.charCodeAt(0)), off=b.addr-APP_START;
      if(!neu.subarray(off,off+roh.length).every(v=>v===0xff)) throw new Error(L.eBelegt(hex(b.addr)));
    }
    sag(L.mWieErwartet,'ok');
    for(const p of DATEN.patches) neu.set(bytes(p.neu),p.addr-APP_START);
    for(const b of DATEN.blobs) neu.set(Uint8Array.from(atob(b.b64),c=>c.charCodeAt(0)),b.addr-APP_START);
    etwasVeraendert=false;
    await schreiben(APP_START,neu,(a,t)=>{fort('#fortSchreiben',a); stand('#standSchreiben',t);});
    sag(L.mKontrolle); stand('#standSchreiben',L.statKontrolle);
    const probe=await lesen(APP_START,APP_LAENGE,null);
    let ab=-1; for(let i=0;i<neu.length;i++) if(probe[i]!==neu[i]){ab=i;break;}
    if(ab>=0) throw new Error(L.eAbweichung(hex(APP_START+ab)));
    fort('#fortSchreiben',1); stand('#standSchreiben',L.statGeprueft);
    sag(L.mPasst(APP_LAENGE),'ok');
    $('#w3').disabled=false; zeigeSeite(5);
  }catch(e){
    sag(L.mAbgebrochen((e&&e.message)||e),'no');
    tipp(etwasVeraendert?L.mSchonGeschrieben:L.mNichtsVeraendert);
    fehlerhilfe(e);
    try{ await abbrechen(); sag(L.mErholt); }catch(e2){ tipp(L.mReagiertNicht); }
    $('#btnSchreiben').disabled=false;
  }
  laeuft=false;
};

$('#btnOriginalHolen').onclick=()=>{ if(!original){alert(L.mKeineSicherung); return;} sicherungSpeichern(); };
$('#btnZurueck').onclick=()=>$('#dateiOriginal').click();
$('#dateiOriginal').onchange=async ev=>{
  const datei=ev.target.files[0]; if(!datei||laeuft) return; laeuft=true;
  try{
    if(!geraet) throw new Error(L.eErstVerbinden);
    const daten=new Uint8Array(await datei.arrayBuffer());
    if(daten.length!==APP_LAENGE) throw new Error(L.eGroesse(datei.name,daten.length,APP_LAENGE));
    sag(L.mSpiele(datei.name));
    await schreiben(APP_START,daten,(a,t)=>{fort('#fortZurueck',a); stand('#standZurueck',t);});
    fort('#fortZurueck',1); stand('#standZurueck',L.statFertig2);
    sag(L.mOriginalDrauf,'ok'); alert(L.mFertigAlert);
  }catch(e){
    sag(L.mZurueckFehler((e&&e.message)||e),'no'); fehlerhilfe(e);
    try{ await abbrechen(); }catch(e2){}
    alert(L.mZurueckFehler((e&&e.message)||e));
  }
  ev.target.value=''; laeuft=false;
};
if('usb' in navigator) navigator.usb.addEventListener('disconnect',ev=>{
  if(geraet&&ev.device===geraet){
    geraet=null; sag(L.mGetrennt,'no'); tipp(L.mTippGetrennt);
    const m=$('#melde4'); m.dataset.leer='0'; m.textContent=L.getrennt;
    $('#btnZurueck').disabled=true; $('#btnVerbinden4').disabled=false;
    $('#btnVerbinden').disabled=false;
  }
});

/* ================== Start ================== */
$('#spDe').onclick=()=>sprache('de');
$('#spEn').onclick=()=>sprache('en');
let start=1, sp=null;
try{
  sp=sessionStorage.getItem('cr_sprache');
  if(sessionStorage.getItem('cr_seite')==='3'){ start=3; sessionStorage.removeItem('cr_seite'); }
}catch(e){}
if(!sp) sp=(navigator.language||'de').toLowerCase().startsWith('de')?'de':'en';
seite=start;
sprache(sp==='en'?'en':'de');
sag(L.mBereit);
if(start===3) sag(L.mNeuGeladen,'ok');
</script>
